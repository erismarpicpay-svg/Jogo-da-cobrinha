<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jogo da Cobrinha</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
}

#pontos {
    font-size: 20px;
    margin-bottom: 10px;
}

canvas {
    background: #222;
    border: 3px solid white;
    width: 320px;
    height: 320px;
    max-width: 90vw;
}

.controles {
    margin: 15px auto;
    display: grid;
    grid-template-columns: 70px 70px 70px;
    width: 210px;
    gap: 5px;
}

button {
    height: 60px;
    font-size: 28px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
}

.cima {
    grid-column: 2;
}

.esquerda {
    grid-column: 1;
}

.baixo {
    grid-column: 2;
}

.direita {
    grid-column: 3;
}

#reiniciar {
    width: 210px;
    height: 50px;
    font-size: 20px;
    background: green;
}
</style>
</head>

<body>

<h1>🐍 Jogo da Cobrinha</h1>

<div id="pontos">Pontos: 0</div>

<canvas id="tela" width="320" height="320"></canvas>

<div class="controles">

<button class="cima" onclick="mover('cima')">⬆️</button>

<button class="esquerda" onclick="mover('esquerda')">⬅️</button>

<button class="baixo" onclick="mover('baixo')">⬇️</button>

<button class="direita" onclick="mover('direita')">➡️</button>

</div>

<button id="reiniciar" onclick="iniciar()">🔄 Reiniciar</button>

<script>

        x: 200,
        y: 200
    };

    direcao = "direita";
    pontos = 0;

    document.getElementById("pontos").innerHTML =

    intervalo = setInterval(jogar, 150);

    desenhar();
}

        comida.x,
        comida.y,
        tamanho - 2,

        } else {
            desenho.fillStyle = "#00aa00";
        }

        desenho.fillRect(
            cobra[i].x,
            cobra[i].y,
            tamanho - 2,
            tamanho - 2
        );
    }
}
